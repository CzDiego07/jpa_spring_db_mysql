services:
    mysql-jpa-empleos:
        image: mysql:8.0
        container_name: base
        restart: unless-stopped
        environment:
            MYSQL_ROOT_PASSWORD: rootpassword
            MYSQL_DATABASE: jpa
            MYSQL_USER: user
            MYSQL_PASSWORD: password
        ports:
            - "3306:3306"
        volumes:
            - mysql_data:/var/lib/mysql
        healthcheck:
            test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uuser", "-ppassword"]
            timeout: 5s
            retries: 10

volumes:
    mysql_data:
